server:
  port: 8080
  tomcat:
    threads:
      max: 200

spring:
  application:
    name: gateway-service
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: gateway-result-store
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

gateway:
  topics:
    request: Audit_Request_Topic
    result: Audit_Result_Topic
    dlq: Audit_DLQ_Topic
  inference:
    # FastAPI wrapper around the same pipeline, used ONLY by the two sync baselines
    sync-url: http://localhost:8000/infer
    # Client-side timeout for sync calls (ms); JMeter timeout must exceed this
    timeout-ms: 240000
  throttle:
    # Sync-throttled condition: HTTP-layer queue with N permits
    permits: 1
    acquire-timeout-ms: 240000
