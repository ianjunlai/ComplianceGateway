services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: cg-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Topics are created explicitly by the gateway with partitions=1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data

  neo4j:
    image: neo4j:5.24-community
    container_name: cg-neo4j
    ports:
      - "7474:7474"   # browser UI
      - "7687:7687"   # bolt
    environment:
      NEO4J_AUTH: neo4j/compliance123
    volumes:
      - neo4j-data:/data

  # Second graph store for the public-benchmark validity check. Community
  # edition serves one database and build_indexes wipes it before rebuilding,
  # so the GDPR graph and the benchmark graph cannot share an instance —
  # separate containers, separate volumes, separate ports.
  #
  # Behind a profile so `docker compose up -d` never starts it by accident;
  # nothing points at it until NEO4J_URI says so:
  #     docker compose --profile benchmark up -d neo4j-benchmark
  #     NEO4J_URI=bolt://localhost:7688 ...
  neo4j-benchmark:
    image: neo4j:5.24-community
    container_name: cg-neo4j-benchmark
    profiles: ["benchmark"]
    ports:
      - "7475:7474"   # browser UI
      - "7688:7687"   # bolt
    environment:
      NEO4J_AUTH: neo4j/compliance123
    volumes:
      - neo4j-benchmark-data:/data

volumes:
  kafka-data:
  neo4j-data:
  neo4j-benchmark-data:
